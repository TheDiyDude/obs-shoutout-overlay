<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Shoutout</title>
<!--
  Shoutout overlay for OBS (browser source 760x1040, 400 px cropped) – see README.md

  EN: Streamer.bot (action "[Shoutout] Overlay") sends {"shoutout": {"login": "...", ...}} through its
  WebSocket server (ws://127.0.0.1:8080). The overlay fetches everything else from Twitch GQL and plays
  the channel's newest clip of today, otherwise a short excerpt in the official Twitch player (running
  stream, otherwise last VOD), otherwise a top clip; type=clip plays top clips only. The player needs
  http://localhost (not file://) and a source height of 1040 with 400 px cropped at the bottom in OBS:
  it starts muted in that cropped area and only moves into the card once real content plays (no ads).
  Several shoutouts are played one after another.

  DE: Streamer.bot (Aktion "[Shoutout] Overlay") schickt per WebSocket-Server {"shoutout": {"login": …}}.
  Das Overlay holt alles Weitere über Twitch-GQL und spielt den neuesten Clip von heute, sonst einen
  kurzen Ausschnitt im offiziellen Twitch-Player (laufender Stream, sonst letztes VOD), sonst einen
  Top-Clip; type=clip spielt nur Top-Clips. Der Player braucht http://localhost statt file:// und eine
  Quellhöhe von 1040 mit 400 px Zuschnitt unten in OBS: Er startet stumm in diesem abgeschnittenen
  Bereich und wandert erst in die Karte, wenn echter Inhalt läuft (keine Werbung).
  Mehrere Shoutouts laufen nacheinander.

  URL parameters / URL-Parameter (?…):
    type=live|vod|clip today's newest clip → live stream → last VOD → clip; vod skips the stream;
                   clip only top clips (live)
                   neuester Clip von heute → Live → letztes VOD → Clip; vod überspringt den Stream;
                   clip nur Top-Clips
    live=<s>       length of the stream excerpt / Länge des Ausschnitts aus Stream oder VOD (20)
    test=<login>   play a shoutout on load / spielt beim Laden einen Shoutout ab
    max=<s>        max clip length in seconds / maximale Clip-Länge (30)
    min=<s>        shorter clips only if the channel has no longer ones / kürzere nur ohne längere (10)
    noclip=<s>     display time without clips / Anzeigedauer ohne Clips (8)
    volume=<0..1>  clip volume / Lautstärke (0.8)
    lang=de|en     overlay language / Sprache des Overlays (de)
    ws=<url>       Streamer.bot WebSocket (ws://127.0.0.1:8080/)
-->
<style>
  :root {
    --card-w: 640px;
    --radius: 18px;
    --accent: #9146ff;
    --panel-top: rgba(38, 62, 72, 0.92);
    --panel-bottom: rgba(16, 28, 36, 0.95);
    --text: #ffffff;
    --muted: #b7c2c8;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", "Segoe UI Variable", Arial, sans-serif; color: var(--text); }

  /* 60 px Rand in der Quelle (760x640), damit der Schatten nicht abgeschnitten wird */
  #card {
    position: absolute; left: 60px; top: 60px;
    width: var(--card-w);
    border-radius: var(--radius);
    overflow: hidden;
    background: #0b1014;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.10),
      0 2px 4px rgba(0, 0, 0, 0.45),
      0 8px 16px rgba(0, 0, 0, 0.45),
      0 20px 40px rgba(0, 0, 0, 0.55),
      0 0 50px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transform: translateY(30px) scale(0.96);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.2, .9, .3, 1.2);
  }
  #card.show { opacity: 1; transform: none; }

  #media { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  #media video, #media .fallback { position: absolute; inset: 0; width: 100%; height: 100%; }
  #media video { object-fit: cover; }
  #media.live video { display: none; }

  /* Twitch-Player: startet unterhalb der Karte (in OBS abgeschnitten, für Twitch aber sichtbar –
     verdeckt oder durchsichtig spielt er nicht), wandert bei echtem Inhalt auf den Medienbereich */
  #live {
    position: absolute; left: 60px; top: 660px; width: var(--card-w); height: 360px;
    border-radius: var(--radius) var(--radius) 0 0; overflow: hidden;
  }
  #live.oncard { top: 60px; }
  #debug {
    position: absolute; left: 4px; top: 2px; width: 750px; height: 56px; overflow: hidden;
    font: 11px/14px monospace; color: #0f0; white-space: pre; text-shadow: 0 0 2px #000;
  }
  #live iframe { width: 100%; height: 100%; border: 0; display: block; }
  #media .fallback {
    display: none; align-items: center; justify-content: center;
    background-size: cover; background-position: center;
  }
  #media .fallback img {
    width: 150px; height: 150px; border-radius: 50%;
    border: 4px solid var(--accent); box-shadow: 0 0 40px rgba(145, 70, 255, 0.6);
  }
  #media.noclip video { display: none; }
  #media.noclip .fallback { display: flex; }

  #progress { height: 6px; background: rgba(145, 70, 255, 0.25); }
  #progress div { height: 100%; width: 0; background: var(--accent); }

  #info {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px 18px;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    min-height: 100px;
  }
  #avatar {
    flex: none; width: 72px; height: 72px; border-radius: 50%;
    object-fit: cover; background: #222;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
  }
  #who { flex: 1 1 0; min-width: 0; }
  #name {
    font-size: 36px; font-weight: 800; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
  }
  #game {
    margin-top: 6px; font-size: 17px; font-weight: 700; line-height: 1.25;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #clip { flex: 0 1 230px; min-width: 0; text-align: right; }
  #title {
    font-size: 20px; font-weight: 600; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta {
    margin-top: 8px; font-size: 18px; color: var(--muted);
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; white-space: nowrap;
  }
  .meta svg { width: 18px; height: 18px; flex: none; }
  #clip.hidden .meta { display: none; }
  #clip .badge {
    display: none; padding: 1px 8px; border-radius: 4px;
    background: #e91916; color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 0.05em;
  }
  #clip.live .badge { display: inline; }
  #clip.live .meta.date svg { display: none; }
  #clip.hidden { flex: none; }
</style>
</head>
<body>
<div id="card">
  <div id="media">
    <video id="video" playsinline preload="auto"></video>
    <div class="fallback" id="fallback"><img id="fallbackAvatar" alt=""></div>
  </div>
  <div id="progress"><div id="bar"></div></div>
  <div id="info">
    <img id="avatar" alt="">
    <div id="who">
      <div id="name"></div>
      <div id="game"></div>
    </div>
    <div id="clip">
      <div id="title"></div>
      <div class="meta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="views"></span>
      </div>
      <div class="meta date">
        <span class="badge">LIVE</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="date"></span>
      </div>
    </div>
  </div>
</div>

<div id="live"></div>
<div id="debug"></div>

<script>
const params = new URLSearchParams(location.search);
const MAX_SECONDS = Number(params.get('max') || 30);
const MIN_SECONDS = Number(params.get('min') || 10);
const NOCLIP_SECONDS = Number(params.get('noclip') || 8);
const TYPE = ['vod', 'clip'].includes((params.get('type') || '').toLowerCase()) ? params.get('type').toLowerCase() : 'live';
const LIVE_SECONDS = Number(params.get('live') || 20);
const LIVE_WAIT = 45;   // so lange darf Werbung vor dem Live-Stream dauern
const VOD_WAIT = 30;
// Der Twitch-Player läuft nur eingebettet in http(s)-Seiten (parent = Hostname), nicht unter file://,
// und braucht die Höhe für den Startbereich unter der Karte (660 + 360 px)
function livePossible() {
  return TYPE !== 'clip' && /^https?:$/.test(location.protocol) && !!location.hostname && innerHeight >= 1020;
}
const VOLUME = Math.min(1, Math.max(0, Number(params.get('volume') || 0.8)));
const WS_URL = params.get('ws') || 'ws://127.0.0.1:8080/';
const LANG = (params.get('lang') || 'de').toLowerCase().startsWith('en') ? 'en' : 'de';
const TEXT = {
  de: { locale: 'de-DE', view: 'Aufruf', views: 'Aufrufe', viewer: 'Zuschauer', viewers: 'Zuschauer', noclip: 'Schaut vorbei!' },
  en: { locale: 'en-US', view: 'view', views: 'views', viewer: 'viewer', viewers: 'viewers', noclip: 'Check them out!' },
}[LANG];
const GQL_URL = 'https://gql.twitch.tv/gql';
const GQL_CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko'; // öffentliche Client-ID der Twitch-Website

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const queue = [];
let busy = false;

// debug=1: letzte Logzeilen im freien Rand über der Karte
const DEBUG = params.has('debug');
function log(...a) {
  console.log('[shoutout]', ...a);
  if (!DEBUG) return;
  const el = $('debug');
  const line = new Date().toTimeString().slice(0, 8) + ' ' + a.join(' ');
  el.textContent = (el.textContent + '\n' + line).split('\n').slice(-4).join('\n');
}

async function gql(query) {
  const res = await fetch(GQL_URL, {
    method: 'POST',
    headers: { 'Client-Id': GQL_CLIENT_ID, 'Content-Type': 'application/json' },
    body: JSON.stringify({ query }),
  });
  if (!res.ok) throw new Error('GQL HTTP ' + res.status);
  const json = await res.json();
  // Teilfehler (z. B. sporadischer "service error" bei einer Clip-Liste) nur loggen, der Rest ist brauchbar
  if (json.errors && !json.data?.user) throw new Error('GQL ' + JSON.stringify(json.errors));
  if (json.errors) log('GQL-Teilfehler:', JSON.stringify(json.errors));
  return json.data;
}

const CLIP_FIELDS = `edges { node {
  slug title viewCount createdAt durationSeconds
  playbackAccessToken(params: {platform: "web", playerBackend: "mediaplayer", playerType: "site"}) { signature value }
  videoQualities { quality sourceURL }
} }`;

// Profil, letztes Spiel, neuester Clip von heute, laufender Stream, letztes VOD und Clips (Top-Clips des letzten Monats, sonst aller Zeiten)
async function fetchStreamer(login) {
  const l = JSON.stringify(login);
  const data = await gql(`query {
    user(login: ${l}) {
      login displayName profileImageURL(width: 150) bannerImageURL
      lastBroadcast { game { name displayName } }
      stream { title viewersCount game { name displayName } }
      videos(first: 1, type: ARCHIVE, sort: TIME) { edges { node {
        id title createdAt lengthSeconds viewCount game { name displayName }
      } } }
      day: clips(first: 20, criteria: {period: LAST_DAY, sort: VIEWS_DESC}) { ${CLIP_FIELDS} }
      month: clips(first: 15, criteria: {period: LAST_MONTH, sort: VIEWS_DESC}) { ${CLIP_FIELDS} }
      all: clips(first: 15, criteria: {period: ALL_TIME, sort: VIEWS_DESC}) { ${CLIP_FIELDS} }
    }
  }`);
  const u = data.user;
  if (!u) return null;
  const usable = c => c && c.videoQualities && c.videoQualities.length && c.playbackAccessToken;
  const month = (u.month?.edges || []).map(e => e.node).filter(usable);
  const all = (u.all?.edges || []).map(e => e.node).filter(usable);
  // Neuester Clip vom heutigen Tag (Twitch sortiert Clips nicht nach Datum, daher selbst)
  const today = new Date().toDateString();
  const todayClip = (u.day?.edges || []).map(e => e.node).filter(usable)
    .filter(c => new Date(c.createdAt).toDateString() === today)
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0] || null;
  const long = list => list.filter(c => (c.durationSeconds || 0) >= MIN_SECONDS);
  // Bevorzugt Clips ab MIN_SECONDS: letzter Monat, sonst aller Zeiten; nur ohne solche auch kürzere
  let clips = long(month);
  if (clips.length < 3) clips = long(all);
  if (!clips.length) clips = month.length >= 3 ? month : all;
  return {
    user: u,
    vod: u.videos?.edges?.[0]?.node || null,
    todayClip,
    clip: clips.length ? clips[Math.floor(Math.random() * clips.length)] : null,
  };
}

// Inhaltskennzeichnungen (laufender Stream, letztes VOD). Der eingebettete Player zeigt bei
// gekennzeichneten Inhalten einen Klick-Hinweis, den im Stream niemand bestätigen kann (2026-10-30
// beim VOD von randvieh, vorher zarbex) – dann Clip statt Stream/VOD. Jede Abfrage einzeln: schlägt
// eine fehl (Feld unbekannt, Fehler), gilt sie als unbekannt und ändert nichts.
async function fetchLabels(login) {
  const l = JSON.stringify(login);
  const ids = list => (list || []).map(x => x.id);
  const probes = {
    stream: [`query { user(login: ${l}) { stream { contentClassificationLabels { id } } } }`,
             u => ids(u.stream?.contentClassificationLabels)],
    vod: [`query { user(login: ${l}) { videos(first: 1, type: ARCHIVE, sort: TIME) { edges { node {
             contentClassificationLabels { id } } } } } }`,
          u => ids(u.videos?.edges?.[0]?.node?.contentClassificationLabels)],
  };
  const result = {};
  await Promise.all(Object.entries(probes).map(async ([key, [query, pick]]) => {
    try { result[key] = pick((await gql(query)).user); }
    catch (e) { result[key] = null; log('Kennzeichnung', key, 'unbekannt:', e.message.slice(0, 80)); }
  }));
  log('Kennzeichnung Stream/VOD:', ['stream', 'vod']
    .map(k => result[k] === null ? '?' : result[k].join(',') || '-').join(' / '));
  return {
    live: !!result.stream?.length,
    vod: !!result.vod?.length,
  };
}

function clipUrl(clip) {
  const q = clip.videoQualities;
  const pick = q.find(v => v.quality === '720') || q.find(v => v.quality === '1080') || q[0];
  const t = clip.playbackAccessToken;
  return `${pick.sourceURL}?sig=${t.signature}&token=${encodeURIComponent(t.value)}`;
}

// Twitch-Embed-Skript einmalig nachladen
let embedScript = null;
function loadEmbed() {
  if (window.Twitch?.Player) return Promise.resolve();
  if (!embedScript) {
    embedScript = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = 'https://player.twitch.tv/js/embed/v1.js';
      el.onload = resolve;
      el.onerror = () => { embedScript = null; reject(new Error('Twitch-Player lädt nicht')); };
      document.head.appendChild(el);
    });
  }
  return embedScript;
}

// Offiziellen Twitch-Player stumm im abgeschnittenen Startbereich starten und warten, bis isContent()
// echten Inhalt meldet (Werbung davor bleibt unsichtbar und stumm); danach laut. Gibt false zurück,
// wenn das binnen waitSeconds nicht klappt.
let current = null;  // { player, isContent } während eines Ausschnitts
async function startPlayer(options, isContent, waitSeconds) {
  await loadEmbed();
  const box = $('live');
  box.classList.remove('oncard');
  box.innerHTML = '';
  const player = new Twitch.Player(box, {
    ...options, parent: [location.hostname], width: '100%', height: '100%',
    autoplay: true, muted: true, controls: false,
  });
  const ok = await new Promise(resolve => {
    const start = Date.now();
    const iv = setInterval(() => {
      let content = false;
      try { content = !player.isPaused() && isContent(player); } catch { /* Player noch nicht bereit */ }
      if (content || Date.now() - start > waitSeconds * 1000) { clearInterval(iv); resolve(content); }
    }, 500);
    player.addEventListener(Twitch.Player.OFFLINE, () => { clearInterval(iv); resolve(false); });
  });
  if (!ok) { stopLive(); return false; }
  player.setVolume(VOLUME);
  player.setMuted(false);
  current = { player, isContent, content: true, misses: 0 };
  return true;
}

// Werbepause mitten im Ausschnitt: Player stumm zurück in den abgeschnittenen Bereich, in der Karte
// so lange Banner und Profilbild; läuft der Stream weiter, kommt er zurück. Erst nach 2 s ohne Inhalt,
// der Player meldet zwischendurch kurz 0 s Latenz.
function watchLive() {
  if (!current) return;
  let content = false;
  try { content = !current.player.isPaused() && current.isContent(current.player); } catch { /* egal */ }
  current.misses = content ? 0 : current.misses + 1;
  if (!content && current.misses < 4) return;
  if (content === current.content) return;
  current.content = content;
  log(content ? 'Stream läuft wieder' : 'Werbepause, Player ausgeblendet');
  current.player.setMuted(!content);
  $('live').classList.toggle('oncard', content);
  $('media').classList.toggle('noclip', !content);
}

// Live: Während Werbung meldet der Player 0 s Latenz zum Broadcaster, beim Stream mehr
function startLive(login) {
  return startPlayer({ channel: login },
    p => (p.getPlaybackStats()?.hlsLatencyBroadcaster || 0) > 0, LIVE_WAIT);
}

// VOD ab zufälliger Stelle (nicht in den ersten/letzten Minuten); Inhalt läuft, wenn die Zeit über
// die Startstelle hinaus weiterläuft
function startVod(vod) {
  const len = vod.lengthSeconds || 0;
  const from = len > LIVE_SECONDS + 240 ? 120 + Math.floor(Math.random() * (len - LIVE_SECONDS - 240)) : 0;
  const time = `${Math.floor(from / 3600)}h${Math.floor(from / 60) % 60}m${from % 60}s`;
  return startPlayer({ video: 'v' + vod.id, time },
    p => p.getCurrentTime() > from + 1, VOD_WAIT);
}

function stopLive() {
  current = null;
  $('live').innerHTML = '';
  $('live').classList.remove('oncard');
  $('media').classList.remove('live');
}

function fmtDate(iso) {
  const d = new Date(iso);
  return LANG === 'en'
    ? d.toLocaleDateString(TEXT.locale, { year: 'numeric', month: 'short', day: 'numeric' })
    : `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
}

function fmtViews(n) {
  return `${n.toLocaleString(TEXT.locale)} ${n === 1 ? TEXT.view : TEXT.views}`;
}

function fmtViewers(n) {
  return `${n.toLocaleString(TEXT.locale)} ${n === 1 ? TEXT.viewer : TEXT.viewers}`;
}

// Lange Namen schrittweise verkleinern (36 → 22 px), erst danach greift die Ellipse
function fitName() {
  const el = $('name');
  let size = 36;
  el.style.fontSize = size + 'px';
  while (el.scrollWidth > el.clientWidth && size > 22) {
    el.style.fontSize = --size + 'px';
  }
}

function runBar(seconds) {
  const bar = $('bar');
  bar.style.transition = 'none';
  bar.style.width = '0';
  void bar.offsetWidth;
  bar.style.transition = `width ${seconds}s linear`;
  bar.style.width = '100%';
}

async function show(so) {
  const login = String(so.login || '').trim().replace(/^@/, '').toLowerCase();
  if (!login) return;
  log('Shoutout für', login);

  let info;
  const labelsPromise = TYPE !== 'clip' ? fetchLabels(login) : Promise.resolve({ live: false, vod: false });
  try { info = await fetchStreamer(login); }
  catch (e) { log('Twitch-Abfrage fehlgeschlagen:', e.message); info = null; }
  const labels = await labelsPromise;

  const user = info?.user;
  // Kette: neuester Clip von heute → laufender Stream → letztes VOD → Clip (type=clip: nur Clip wie früher)
  const todayClip = TYPE !== 'clip' ? info?.todayClip : null;
  const clip = todayClip || info?.clip;
  const vod = info?.vod;
  const name = user?.displayName || so.displayName || login;
  const avatar = user?.profileImageURL || so.profileImage || '';
  // displayName ist in der Sprache des Rechners, name immer englisch
  const stream = TYPE === 'live' ? user?.stream : null;  // type=vod: laufenden Stream überspringen
  const g = stream?.game || vod?.game || user?.lastBroadcast?.game;
  const game = (LANG === 'en' ? g?.name : g?.displayName) || g?.displayName || so.game || '';
  if (!user && !so.displayName) { log('Kanal nicht gefunden:', login); return; }

  $('name').textContent = name;
  $('game').textContent = game;
  $('avatar').src = avatar;
  $('fallbackAvatar').src = avatar;
  $('fallback').style.backgroundImage = user?.bannerImageURL
    ? `linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url("${user.bannerImageURL}")`
    : 'radial-gradient(circle at 50% 45%, #5b2aa8 0%, #2a1550 45%, #120a22 100%)';

  const video = $('video');
  let seconds = NOCLIP_SECONDS;
  let playing = false;
  let live = false;

  // Ausschnitt aus dem laufenden Stream, sonst aus dem letzten VOD
  $('clip').classList.remove('live');
  if (todayClip) log('Neuester Clip von heute:', todayClip.title);
  if (!todayClip && user && livePossible() && (stream || vod)) {
    $('media').classList.remove('noclip');
    $('media').classList.add('live');
    try {
      if (stream && labels.live) {
        log('Stream mit Inhaltskennzeichnung, überspringe ihn');
      } else if (stream && await startLive(user.login)) {
        $('title').textContent = stream.title || '';
        $('views').textContent = fmtViewers(stream.viewersCount || 0);
        $('date').textContent = '';
        $('clip').classList.add('live');
        live = true;
      } else if (stream) {
        log('Live-Stream startet nicht (Werbung zu lang, Sperre?)');
      }
      if (!live && vod && labels.vod) {
        log('VOD mit Inhaltskennzeichnung, überspringe es');
      } else if (!live && vod && await startVod(vod)) {
        $('title').textContent = vod.title || '';
        $('views').textContent = fmtViews(vod.viewCount || 0);
        $('date').textContent = fmtDate(vod.createdAt);
        live = true;
      }
    } catch (e) {
      log('Twitch-Player:', e.message);
    }
    if (live) {
      $('clip').classList.remove('hidden');
      seconds = LIVE_SECONDS;
    } else {
      log('Kein Ausschnitt aus Stream oder VOD, nehme Clip');
      stopLive();
    }
  }

  if (clip && !live) {
    $('title').textContent = clip.title;
    $('views').textContent = fmtViews(clip.viewCount);
    $('date').textContent = fmtDate(clip.createdAt);
    $('clip').classList.remove('hidden');
    $('media').classList.remove('noclip');
    video.src = clipUrl(clip);
    video.volume = VOLUME;
    try {
      await new Promise((resolve, reject) => {
        video.oncanplay = resolve;
        video.onerror = () => reject(new Error('Video lädt nicht'));
        setTimeout(() => reject(new Error('Timeout beim Laden')), 10000);
        video.load();
      });
      seconds = Math.min(clip.durationSeconds || MAX_SECONDS, MAX_SECONDS);
      playing = true;
    } catch (e) {
      log('Clip nicht abspielbar:', e.message);
    }
  }
  if (!playing && !live) {
    $('title').textContent = TEXT.noclip;
    $('clip').classList.add('hidden');
    $('media').classList.add('noclip');
    video.removeAttribute('src');
  }

  fitName();
  $('card').classList.add('show');
  await sleep(500);
  if (live) $('live').classList.add('oncard');
  if (playing) {
    video.currentTime = 0;
    try { await video.play(); } catch (e) { log('play() fehlgeschlagen:', e.message); }
  }
  log(`Karte an: ${live ? 'Twitch-Player' : playing ? 'Clip' : 'ohne Clip'}, ${seconds} s`);
  runBar(seconds);
  const watch = live ? setInterval(watchLive, 500) : null;
  await new Promise(resolve => {
    const t = setTimeout(resolve, seconds * 1000);
    video.onended = () => { clearTimeout(t); resolve(); };
  });
  clearInterval(watch);
  log('Karte aus');
  stopLive();
  $('card').classList.remove('show');
  await sleep(600);
  video.pause();
  video.removeAttribute('src');
  video.load();
}

async function pump() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    try { await show(queue.shift()); } catch (e) { log('Fehler:', e); }
    await sleep(1000);
  }
  busy = false;
}

function enqueue(so) {
  queue.push(so);
  pump();
}

// Streamer.bot schickt CPH.WebsocketBroadcastJson als Ereignis General.Custom
function findShoutout(msg) {
  if (!msg || typeof msg !== 'object') return null;
  if (msg.shoutout) return msg.shoutout;
  if (msg.data && msg.data.shoutout) return msg.data.shoutout;
  return null;
}

function connect() {
  let ws;
  try { ws = new WebSocket(WS_URL); } catch (e) { setTimeout(connect, 5000); return; }
  ws.onopen = () => {
    log('verbunden mit', WS_URL);
    ws.send(JSON.stringify({ request: 'Subscribe', id: 'shoutout-sub', events: { General: ['Custom'] } }));
  };
  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    const so = findShoutout(msg);
    if (so) enqueue(so);
  };
  ws.onclose = () => setTimeout(connect, 5000);
  ws.onerror = () => ws.close();
}

connect();
if (params.get('test')) enqueue({ login: params.get('test') });
</script>
